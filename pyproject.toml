# encoding: utf-8
[project]
name = "fix-flash-attn-schema"
description = "Bypass ComfyUI's torch.library.custom_op schema-registration bug that causes Flash Attention to silently fall back to SDPA (schema_.has_value() INTERNAL ASSERT FAILED)."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/love530love/ComfyUI-FixFlashAttnSchema"
Documentation = "https://github.com/love530love/ComfyUI-FixFlashAttnSchema#readme"
"Bug Tracker" = "https://github.com/love530love/ComfyUI-FixFlashAttnSchema/issues"

[tool.comfy]
PublisherId = "060d919d-d603-4db1-a058-8aba4eaf77a8"
DisplayName = "Fix: Flash Attention Schema Bug"
